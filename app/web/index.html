<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TIPO — TIten POsko. Read the signs. Act first. AI triage copilot for disaster posko operators.">
  <meta name="theme-color" content="#0B1F3A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TIPO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>TIPO — Posko Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B1F3A; }
    #tipo-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0B1F3A; color: #FFFFFF;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 280ms ease;
      z-index: 10;
    }
    #tipo-splash img { width: 112px; height: 112px; border-radius: 26px; }
    #tipo-splash .name { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
    #tipo-splash .tag { font-size: 14px; color: #FF9A4D; font-weight: 600; }
    #tipo-splash .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; }
    #tipo-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #FF7A1A;
      animation: tipo-load 1.1s ease-in-out infinite;
    }
    @keyframes tipo-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #tipo-splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="tipo-splash" role="status" aria-label="TIPO is loading">
    <img src="icons/splash-logo.png" alt="">
    <div class="name">TIPO</div>
    <div class="tag">Read the signs. Act first.</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('tipo-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
